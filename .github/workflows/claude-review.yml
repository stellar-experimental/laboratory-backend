# Claude PR Review
#
# Runs a single Claude review agent on each PR. The agent covers every
# concern (database, TypeScript/Express, Docker, security, docs) in one
# pass and posts ONE pull request review: inline comments only where a
# change is actually needed, plus a single summary comment. It runs on
# `claude-haiku-4-5` to keep cost low.
#
# Why one job (not a matrix of specialists): five parallel jobs each
# posted their own top-level summary comment, cluttering the PR. A
# single job with `use_sticky_comment` produces one consolidated review.
# To re-add depth on a specific concern, extend the `## Review scope`
# section of the prompt below rather than splitting into jobs.
#
# Skills are vendored at `.claude/skills/<name>/SKILL.md`. We load
# postgres-optimization, docker-patterns, and security-audit. TypeScript
# and docs review are prompt-only (no skill fit cleanly, and importing
# foreign conventions hurts more than it helps).
#
# Security model is borrowed from stellar/actions PR #103
# (https://github.com/stellar/actions/pull/103). This repo doesn't accept
# fork-based contributions, so we use the safer `pull_request` trigger.
# Switch to `pull_request_target` only if that changes — and re-read the
# threat model in that PR first.
name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

permissions: {}

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # One review per PR; a new push cancels the stale run.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # Trusted base ref. We use `pull_request` (not `_target`), so this
      # is effectively the same as the PR head from a permissions
      # standpoint — secrets are only available for same-repo PRs. Fetch
      # full history for `git log` / `git blame`.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@20c8abf165d5f85ab3fc970db9498436377dc9d1 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          # Consolidate the summary into a single comment that updates in
          # place across re-runs, instead of stacking a new one per push.
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the sole review agent for this PR. Cover every scope
            below in one pass and deliver a SINGLE pull request review.

            ## Required: load your skills first

            Before reading any PR code, invoke the Skill tool for each of
            these (committed at `.claude/skills/<name>/SKILL.md`):
            **postgres-optimization, docker-patterns, security-audit**

            Treat each skill's content as authoritative guidance for the
            matching scope below.

            ## Review scope

            Read the diff with `gh pr diff ${{ github.event.pull_request.number }}`
            and the PR metadata with `gh pr view ${{ github.event.pull_request.number }}`.
            Review only what the diff changes. Prefix every finding with a
            tag so its concern is clear: [DB], [TS], [Docker], [Security],
            or [Docs].

            - [DB] Database (skill: postgres-optimization). This service is
              a READ-ONLY consumer of a database owned by another repo — it
              does NOT run or own migrations. Do NOT raise migration,
              backfill, nullability, or locking concerns. Focus on query
              patterns (N+1, unbounded `findMany`, missing `select`/`include`
              scoping), pagination correctness (cursor vs offset),
              connection pooling (Cloud SQL connector), and prepared
              statements.
            - [TS] TypeScript / Node / Express. Type narrowing, `any`/
              `unknown`, unsafe casts, missing return types on exported
              functions; Zod parse vs safeParse at boundaries; unhandled
              promises and error handling at async boundaries; Express 5
              handler/middleware/error-middleware patterns; idiomatic
              Node 22+ (no legacy callbacks where async exists). Do not
              flag style/format issues owned by prettier/eslint.
            - [Docker] Container & bundle size (skill: docker-patterns).
              Look at `Dockerfile`, `.dockerignore`, `Makefile`, added
              deps: dev deps leaking into runtime, heavy deps with lighter
              alternatives, layer-cache ordering, `.dockerignore` coverage,
              alpine base, `--ignore-scripts` prod install, `USER node`.
            - [Security] (skill: security-audit). Hardcoded secrets/leaked
              env vars, `creds.json` handling; input validation at HTTP
              boundaries (zod, injection); authN/authZ gaps; rate-limit /
              helmet / CORS / proxy-addr / trust-proxy misconfig; SSRF,
              open redirects, prototype pollution; risky dep additions
              (CVEs, abandoned, supply-chain); logging of PII/tokens via
              pino. Cite OWASP categories where relevant.
            - [Docs] Documentation drift introduced by THIS PR only.
              README still accurate for changed behavior/env vars/scripts/
              endpoints? New env vars in `.env.example`? New pnpm scripts
              or Makefile targets documented? Changed exported functions'
              JSDoc still accurate? Do not propose brand-new docs pages.

            ## How to deliver findings — ONE review

            1. Post an inline comment ONLY where the diff requires a
               change. No inline comments for praise, nitpicks already
               handled by linters, or anything outside the diff. Prefix
               each with its tag, e.g. `[DB] Unbounded findMany — add a
               take/limit.`
            2. End with exactly ONE summary comment via
               `gh pr comment ${{ github.event.pull_request.number }} --body "..."`.
               Head it `## Claude Review`. Briefly note what you checked
               and reference the inline counts per tag — do not repeat the
               inline bodies.
            3. If nothing needs changing, post only the summary with a
               one-line "No issues found." and zero inline comments.

            ## Rules

            - Cite file:line for every claim. No vague advice.
            - Pass the PR number explicitly to `gh` commands; don't rely
              on cwd.
            - Be concise and high-signal — only surface things worth a
              human's time.
          claude_args: |
            --model claude-haiku-4-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment ${{ github.event.pull_request.number }}:*),Bash(gh pr diff ${{ github.event.pull_request.number }}:*),Bash(gh pr view ${{ github.event.pull_request.number }}:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(rg:*),Bash(cat:*),Bash(ls:*),Bash(find:*)"
